services:
  server:
    image: ${DOCKER_REGISTRY-}racetimerserver
    build:
      context: .
      dockerfile: RaceTimerServer/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      RaceTimer__DatabasePath: /data/racetimer.db
      Authentication__Enabled: "true"
      Authentication__ConnectionString: Host=db;Database=racetimer;Username=racetimer;Password=${RACETIMER_DB_PASSWORD:?RACETIMER_DB_PASSWORD must be set}
      Authentication__Issuer: ${RACETIMER_SERVER_ISSUER:-http://localhost:${RACETIMER_SERVER_PORT:-8080}/}
      Authentication__BootstrapToken: ${RACETIMER_BOOTSTRAP_TOKEN:?RACETIMER_BOOTSTRAP_TOKEN must be set}
      Authentication__WebClientSecret: ${RACETIMER_WEB_CLIENT_SECRET:?RACETIMER_WEB_CLIENT_SECRET must be set}
    ports:
      - "${RACETIMER_SERVER_PORT:-8080}:8080"
    volumes:
      - racetimer-server-data:/data
    networks:
      - racetimer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: racetimer
      POSTGRES_USER: racetimer
      POSTGRES_PASSWORD: ${RACETIMER_DB_PASSWORD:?RACETIMER_DB_PASSWORD must be set}
    volumes:
      - racetimer-db-data:/var/lib/postgresql/data
    networks:
      - racetimer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racetimer -d racetimer"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${DOCKER_REGISTRY-}racetimer-web
    build:
      context: .
      dockerfile: RaceTimerApp/RaceTimerApp.Web/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      RaceTimer__Mode: Hosted
      RaceTimer__ServerUrl: http://server:8080
      Authentication__Authority: http://localhost:${RACETIMER_SERVER_PORT:-8080}
      Authentication__ClientId: racetimer-web
      Authentication__ClientSecret: ${RACETIMER_WEB_CLIENT_SECRET:?RACETIMER_WEB_CLIENT_SECRET must be set}
    ports:
      - "${RACETIMER_WEB_PORT:-8088}:8080"
    networks:
      - racetimer-network
    depends_on:
      server:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  racetimer-network:
    driver: bridge

volumes:
  racetimer-server-data:
  racetimer-db-data:
